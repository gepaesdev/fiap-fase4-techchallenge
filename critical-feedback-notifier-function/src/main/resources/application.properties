spring.application.name=critical-feedback-notifier-function
spring.main.web-application-type=none
spring.main.banner-mode=off

# Structured JSON logs (Elastic Common Schema): every line becomes a queryable record in Application Insights.
logging.structured.format.console=ecs

# E-mail delivery, from app settings / env vars (Key Vault references in Azure).
# EMAIL_PROVIDER: azure (default) or log (local development only).
email.provider=${EMAIL_PROVIDER:azure}
email.endpoint=${ACS_ENDPOINT:}
email.sender-address=${EMAIL_SENDER_ADDRESS:}
email.admin-recipients=${ADMIN_EMAILS:}
