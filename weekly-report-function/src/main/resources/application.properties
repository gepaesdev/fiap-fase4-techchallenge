spring.application.name=weekly-report-function
spring.main.web-application-type=none
spring.main.banner-mode=off

# Structured JSON logs (Elastic Common Schema): every line becomes a queryable record in Application Insights.
logging.structured.format.console=ecs

# Defaults; app settings / env vars override them (COSMOS_ENDPOINT, COSMOS_DATABASE, COSMOS_CONTAINER,
# COSMOS_REPORTS_CONTAINER, and COSMOS_KEY for the local emulator only — in Azure the Managed Identity is used).
cosmos.database=feedback-platform
cosmos.container=feedbacks
cosmos.reports-container=weekly-reports

# E-mail delivery (Key Vault references in Azure). EMAIL_PROVIDER: azure (default) or log (local only).
email.provider=${EMAIL_PROVIDER:azure}
email.endpoint=${ACS_ENDPOINT:}
email.sender-address=${EMAIL_SENDER_ADDRESS:}
email.admin-recipients=${ADMIN_EMAILS:}

# 1 = previous full week (production); 0 = current week so far (local tests and live demos).
report.week-offset=${REPORT_WEEK_OFFSET:1}
