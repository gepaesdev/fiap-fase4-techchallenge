spring.application.name=submit-feedback-function
spring.main.web-application-type=none
spring.main.banner-mode=off

# The API contract says "nota" is an integer: reject 7.5 instead of silently truncating it to 7.
spring.jackson.deserialization.accept-float-as-int=false

# Defaults; app settings / env vars override them (COSMOS_ENDPOINT, COSMOS_DATABASE, COSMOS_CONTAINER,
# and COSMOS_KEY for the local emulator only — in Azure the Managed Identity is used).
cosmos.database=feedback-platform
cosmos.container=feedbacks

# Structured JSON logs (Elastic Common Schema): every line becomes a queryable record in Application Insights.
logging.structured.format.console=ecs
